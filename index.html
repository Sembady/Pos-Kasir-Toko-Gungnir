<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS Toko Gungnir</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--pr:#4f46e5;--mut:#5b6578;--bd:#d3d9e6;--ca:100%}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg) center/cover fixed;color:var(--tx)}
header{background:var(--pr) center/cover;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20;text-shadow:0 1px 2px #0006;overflow:hidden}
#hdrVid,#hdrDim{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#hdrVid{object-fit:cover}
header .hr,header nav{position:relative;z-index:1}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hr h1{margin:0;font-size:20px}.hr small{display:block;opacity:.9}
#lg{height:38px;border-radius:8px}nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
nav button{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:#fff;color:#111;text-shadow:none}.nb{background:#dc2626;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}
main{max-width:1200px;margin:auto;padding:12px}
.card{background:color-mix(in srgb,var(--card) var(--ca),transparent);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#dc2626}
.btn:disabled{background:#94a3b8;color:#e2e8f0;cursor:not-allowed;filter:grayscale(1);opacity:.7}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;width:100%}
label{display:block;margin:6px 0;font-size:13px;color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.split{display:grid;grid-template-columns:1fr 390px;gap:12px}@media(max-width:860px){.split{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pc.dis{opacity:.5;cursor:not-allowed}.pc img,.ini{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.ini{display:grid;place-items:center;font-size:30px;font-weight:700;background:var(--pr);color:#fff}.th{width:44px;height:44px}.th .ini{font-size:18px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.b{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
.b-ok{background:#dcfce7;color:#166534}.b-wn{background:#fef08a;color:#713f12}.b-bd{background:#fecaca;color:#991b1b}
[data-dark="1"] .b-ok{background:#14532d;color:#bbf7d0}[data-dark="1"] .b-wn{background:#713f12;color:#fef08a}[data-dark="1"] .b-bd{background:#7f1d1d;color:#fecaca}
.ban{background:#fef08a;color:#713f12;border:1px solid #eab308;border-radius:10px;padding:10px;margin-bottom:12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpi .card{margin:0}.kpi b{font-size:22px;display:block}
.ci{border-bottom:1px solid var(--bd);padding:6px 0}.ci input{width:80px;padding:4px}.tot{font-size:22px;font-weight:700}
#modal{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:12px}
.mb{background:var(--card);color:var(--tx);border-radius:12px;padding:16px;width:min(440px,100%);max-height:90vh;overflow:auto}
#toasts{position:fixed;bottom:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:6px;max-width:92vw}
.t{padding:10px 14px;border-radius:10px;color:#fff;background:#334155;box-shadow:0 4px 12px #0005}.t.err{background:#dc2626}.t.ok{background:#16a34a}.t.warn{background:#ca8a04}

/* ===== PERAPIAN KHUSUS MASTER DATA ===== */
#t-master .master-card{overflow:hidden}
#t-master .master-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#t-master .master-head h3{margin:0;font-size:18px}
#t-master .master-table{width:100%;min-width:1042px;table-layout:fixed;border-collapse:separate;border-spacing:0}
#t-master .master-table th{font-size:13px;color:var(--mut);font-weight:700;background:color-mix(in srgb,var(--card) 88%,var(--pr) 12%);padding:12px 10px;vertical-align:middle}
#t-master .master-table td{height:76px;vertical-align:middle;padding:9px 10px;white-space:normal;overflow-wrap:anywhere}
#t-master .master-table tbody tr:nth-child(even){background:color-mix(in srgb,var(--card) 92%,var(--pr) 8%)}
#t-master .master-table tbody tr:hover{background:color-mix(in srgb,var(--pr) 8%,var(--card))}
#t-master .master-table th:nth-child(1),#t-master .master-table td:nth-child(1){width:82px}
#t-master .master-table th:nth-child(2),#t-master .master-table td:nth-child(2){width:190px}
#t-master .master-table th:nth-child(3),#t-master .master-table td:nth-child(3){width:140px}
#t-master .master-table th:nth-child(4),#t-master .master-table td:nth-child(4){width:120px}
#t-master .master-table th:nth-child(5),#t-master .master-table td:nth-child(5){width:75px}
#t-master .master-table th:nth-child(6),#t-master .master-table td:nth-child(6){width:65px}
#t-master .master-table th:nth-child(7),#t-master .master-table td:nth-child(7){width:110px}
#t-master .master-table th:nth-child(8),#t-master .master-table td:nth-child(8){width:260px}
#t-master .th{width:56px;height:56px;min-width:56px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:9px;background:color-mix(in srgb,var(--pr) 10%,var(--card));border:1px solid var(--bd)}
#t-master .th img,#t-master .th .ini{display:block;width:56px!important;height:56px!important;min-width:56px;max-width:76px;aspect-ratio:1;object-fit:cover;object-position:center;border-radius:8px}
#t-master .th .ini{font-size:20px}
#t-master .master-actions{display:flex;align-items:center;justify-content:flex-start;gap:6px;flex-wrap:wrap}
#t-master .master-actions .btn{font-size:12px;padding:7px 9px;line-height:1.2;white-space:nowrap}
#t-master .master-price,#t-master .master-stock{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap!important}
#modal .mb #pv{display:flex;align-items:center;gap:10px;min-height:0;margin:8px 0}
#modal .mb #pv img{display:block;width:76px!important;height:76px!important;object-fit:cover;object-position:center;border:1px solid var(--bd);border-radius:10px}
@media(max-width:700px){#t-master .master-head h3{font-size:16px}#t-master .master-table{min-width:1042px}}

/* ===== HUBUNGI CS & QR ===== */
#t-kasir{padding-bottom:78px}
.cs-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:15;max-width:calc(100vw - 24px)}
.cs-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#075e54;border:2px solid #25d366;border-radius:999px;padding:9px 20px 9px 14px;font-weight:700;text-decoration:none;text-shadow:none;box-shadow:0 4px 14px #0006;white-space:nowrap}
.cs-btn svg{width:26px;height:26px;fill:#25d366;flex:none}
.cs-btn:hover{background:#ecfdf3}.cs-btn:focus-visible{outline:3px solid #25d366;outline-offset:2px}
.qr{text-align:center;margin:8px 0}.qr img{display:block;margin:0 auto;width:min(100%,230px);aspect-ratio:1;object-fit:contain;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--bd)}.qr small{display:block;margin:4px 0;color:var(--mut)}
/* ===== LOGIN, STRUKTUR, MARQUEE, RATING ===== */
.hact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}#auth{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:13px}
nav button.lk{opacity:.7}nav button.lk::after{content:" 🔒"}
#mq{overflow:hidden;background:#0f172a;color:#fde68a;font-size:14px;white-space:nowrap;border-bottom:2px solid var(--pr)}
#mq .mqi{display:inline-block;padding:6px 0 6px 100%;animation:mq 60s linear infinite}#mq:hover .mqi{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){#mq .mqi{animation:none;padding-left:12px}}
.rt{display:flex;gap:2px;align-items:center;margin:6px 0}.rt button{background:none;border:0;padding:2px;cursor:pointer;line-height:0}.rt svg{width:30px;height:30px}.rt .s0{fill:none;stroke:var(--mut);stroke-width:1.6}.rt .s1{fill:#facc15;stroke:#ca8a04;stroke-width:1.2}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--pr);color:#fff;font-weight:700;font-size:26px;overflow:hidden;flex:none}img.av{display:block}
.org{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:8px 0 14px}.oc{width:210px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.oc .av{margin:0 auto 6px}.oc small{display:block;color:var(--mut)}.oc .row{justify-content:center;margin-top:8px}.oc .btn{padding:5px 8px;font-size:12px}
/* ===== INFO PEMBAYARAN & BUKTI ===== */
.pinfo{margin:8px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:rgba(255,255,255,.05)}.pinfo>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0}.pinfo>div.row{justify-content:flex-start;flex-wrap:wrap}.pinfo span{color:var(--mut)}.pinfo b{text-align:right;word-break:break-word}
a.btn,label.btn{display:inline-block;text-decoration:none;font-size:13px}
</style></head><body>

 if(f.size>15*1024*1024)return toast('Ukuran file maksimal 15 MB agar aplikasi tetap ringan.','err');
 const r=new FileReader();r.onload=()=>{S.settings.hdrImg=r.result;S.savedAt=Date.now();
 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Media aktif, namun terlalu besar untuk cache browser. Klik "Simpan HTML" untuk menyimpan permanen.','warn')}
 theme();rT()};r.onerror=()=>toast('File header tidak terbaca.','err');r.readAsDataURL(f)}
function pt(k){Object.assign(S.settings,THEMES[k],{theme:k});save();theme();rT()}
function rT(){const s=S.settings,hs=hdrLabel();$('#t-set').innerHTML=`<div class="card"><h3 style="margin-top:0">Identitas Usaha</h3><label>Nama usaha<input value="${esc(s.name)}" oninput="sv('name',this.value)"></label><label>Nama kelompok<input value="${esc(s.group)}" oninput="sv('group',this.value)"></label>
 <label>Logo<input type="file" accept="image/*" onchange="si('logo',this,256,1,true)"></label><button class="btn g" onclick="sv('logo','');rT()">Hapus logo</button>
 <label>Ubah Customer Service (link WhatsApp)<input placeholder="https://wa.chat/TokoGungnir" value="${esc(s.csLink)}" oninput="sv('csLink',this.value)"></label><button class="btn g" onclick="sv('csLink',CS0);rT()">Kembalikan link awal</button>
  <label>Input Kode QR (untuk pembayaran QRIS)<input type="file" accept="image/*" onchange="si('qrImg',this,640,1,true)"></label>${s.qrImg?`<div class="qr" style="text-align:left"><img src="${s.qrImg}" alt="Kode QR tersimpan" style="width:110px;margin:0"></div>`:''}<button class="btn g" onclick="sv('qrImg','');rT()">Hapus kode QR</button>
  <label>Jenis diskon<select onchange="S.settings.disc=this.value;save()"><option value="pct" ${s.disc=='pct'?'selected':''}>Persen (%)</option><option value="rp" ${s.disc=='rp'?'selected':''}>Rupiah (Rp)</option></select></label></div>
 <div class="card"><h3 style="margin-top:0">Latar Belakang</h3><label>Link Foto / Video / Animasi header (${hs})<input value="${esc(s.hdrUrl)}" placeholder="https://.../header.mp4 atau .gif / .jpg / .png" onchange="shUrl(this.value)"></label><small style="display:block;margin:-2px 0 6px;color:var(--mut)">Tempel link langsung ke file (bukan unggah) agar file HTML tetap ringan. Video: .mp4 / .webm. Gambar atau animasi: .jpg .png .gif .webp. Link Google Drive untuk gambar juga didukung (akses: siapa saja yang memiliki link). Tekan Enter atau klik di luar kolom untuk menerapkan.</small><label>Foto utama (landscape)<input type="file" accept="image/*" onchange="si('bgImg',this,1600,.7)"></label>
 <div class="row"><button class="btn g" onclick="sv('hdrImg','');sv('hdrUrl','');rT()">Hapus latar header</button><button class="btn g" onclick="sv('bgImg','');rT()">Hapus foto utama</button></div><label>Gelap latar header (${s.dim})<input type="range" min="0" max="80" value="${s.dim}" oninput="sv('dim',+this.value)"></label><label>Transparansi kartu (${s.alpha})<input type="range" min="40" max="100" value="${s.alpha}" oninput="sv('alpha',+this.value)"></label></div>
 <div class="card"><h3 style="margin-top:0">Tema &amp; Warna</h3><div class="row">${Object.keys(THEMES).map(k=>`<button class="btn ${s.theme==k?'':'g'}" onclick="pt('${k}')">${k}</button>`).join('')}</div>
 <div class="row"><label>Utama<input type="color" value="${s.pr}" oninput="sv('pr',this.value)"></label><label>Latar<input type="color" value="${s.bg}" oninput="sv('bg',this.value)"></label><label>Kartu<input type="color" value="${s.card}" oninput="sv('card',this.value)"></label></div></div>
 ${payCard()}${orgCard()}<div class="card"><h3 style="margin-top:0">Simpan &amp; Pindah Perangkat</h3><div class="row"><button class="btn" onclick="saveHtml(1)">HTML + data transaksi</button><button class="btn g" onclick="saveHtml(0)">HTML tanpa transaksi (template)</button></div>
 <hr><button class="btn r" onclick="rst()">Reset Semua</button></div>`}
function saveHtml(w){if(!can())return toast('Simpan HTML hanya untuk Pimpinan & Manajer. Silakan login.','err');const o=JSON.parse(JSON.stringify(S));o.savedAt=Date.now();if(!w){o.sales=[];o.cart=[];o.stockLog=[];o.seq={}}
 const c=document.documentElement.cloneNode(true);c.querySelector('#seed').textContent=JSON.stringify(o).replace(/</g,'\\u003c');
 c.querySelectorAll('.dyn').forEach(e=>e.innerHTML='');c.removeAttribute('style');c.removeAttribute('data-dark');c.querySelector('body').removeAttribute('style');c.querySelector('header').removeAttribute('style');
 const hv=c.querySelector('#hdrVid');if(hv){hv.removeAttribute('src');hv.setAttribute('hidden','')}const hd=c.querySelector('#hdrDim');if(hd){hd.removeAttribute('style');hd.setAttribute('hidden','')}
 dl(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}),'pos-'+S.settings.name.replace(/\W+/g,'-').toLowerCase()+(w?'':'-template')+'.html');toast('File HTML diunduh.','ok')}
function rst(){if(confirm('Reset SEMUA data & pengaturan? Tindakan ini tidak bisa dibatalkan.')){localStorage.removeItem(K);S=def();save();ui.tab='kasir';R()}}
/* ===== LOGIN, STRUKTUR ORGANISASI, MARQUEE, RATING ===== */
const LV=['Pimpinan','Manajer','Anggota'],ADM=['Pimpinan','Manajer'];
const me=()=>S.members.find(m=>m.id==ui.user),can=()=>{const m=me();return !!m&&ADM.includes(m.level)};
const lastAdm=id=>{const m=S.members.find(x=>x.id==id);return ADM.includes(m.level)&&!S.members.some(x=>x.id!=id&&ADM.includes(x.level))};
const dupN=(n,id)=>S.members.some(m=>m.id!=id&&m.name.trim().toLowerCase()==n.toLowerCase());
function rA(){const m=me(),b='style="color:#fff;border-color:#fff8;padding:4px 10px"';$('#auth').innerHTML=m?`<span>👤 ${esc(m.name)} · ${m.level}</span><button class="btn g" ${b} onclick="lgo()">Keluar</button>`:`<button class="btn g" ${b} onclick="lgf()">🔑 Login</button>`}
function lgf(){modal(`<h3 style="margin-top:0">Login</h3><label>Nama<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')lgn()"></label><div class="row" style="margin-top:10px"><button class="btn" onclick="lgn()">Masuk</button><button class="btn g" onclick="mc()">Batal</button></div>`);setTimeout(()=>$('#lu').focus(),50)}
function lgn(){const n=$('#lu').value.trim().toLowerCase(),m=S.members.find(x=>x.name.trim().toLowerCase()==n&&x.pass===$('#lp').value);if(!m)return toast('Nama atau password salah.','err');ui.user=m.id;mc();toast(`Selamat datang, ${m.name} (${m.level}).`,'ok');R()}
function lgo(){ui.user=null;toast('Anda sudah keluar.');R()}
let mqh='';
function rQ(){const t=S.sales.slice().sort((a,b)=>b.total-a.total).slice(0,5),h=t.length?t.map((s,i)=>`🏆 #${i+1} · Tanggal: ${new Date(s.date).toLocaleDateString('id-ID')} · Produk: ${esc(s.name)} · Jumlah: ${s.qty} · Penjualan: ${rp(s.total)}`).join('&emsp;✦&emsp;'):'Belum ada penjualan. Penjualan tertinggi akan tampil di sini setelah ada transaksi.';
  if(h!==mqh||!$('#mq').firstChild){mqh=h;$('#mq').innerHTML=`<div class="mqi" style="animation-duration:${Math.max(25,Math.round(h.length/6))}s">${h}</div>`}}
const STAR=c=>`<svg viewBox="0 0 24 24" aria-hidden="true"><polygon class="${c}" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg>`;
const av=m=>m.photo?`<img class="av" src="${m.photo}" alt="${esc(m.name)}">`:`<div class="av">${esc((m.name.trim()[0]||'?').toUpperCase())}</div>`;
function mPv(d){ui.mp=d;$('#mpv').innerHTML=`<img class="av" src="${d}" alt="">`}
function orgCard(){const ed=S.members.find(m=>m.id==ui.ed),e=!!ed;
  const f=`<div id="mf"><div class="row" style="align-items:flex-start"><div id="mpv">${ui.mp?`<img class="av" src="${ui.mp}" alt="">`:`<div class="av">${esc(((ed?ed.name:'')[0]||'?').toUpperCase())}</div>`}</div><div style="flex:1;min-width:220px">
  <label>Nama<input id="mn" value="${esc(ed?ed.name:'')}"></label><label>Jabatan<input id="mj" value="${esc(ed?ed.role:'')}"></label>
  ${e?`<label>Password lama<input id="mo" type="password" autocomplete="off"></label><label>Password baru (kosongkan jika tidak diubah)<input id="mw" type="password" autocomplete="new-password"></label>`:`<label>Password<input id="mw" type="password" autocomplete="new-password"></label>`}
  <label>Level<select id="ml">${LV.map(l=>`<option ${ed&&ed.level==l?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>Unggah foto<input type="file" accept="image/*" onchange="img(this.files[0],240,.8,mPv)"></label></div></div>
  <div class="row" style="margin-top:8px">${e?`<button class="btn" onclick="mSv()">Simpan perubahan</button><button class="btn g" onclick="ui.ed=null;ui.mp='';rT()">Batal edit</button>`:`<button class="btn" onclick="mAdd()">Tambah anggota</button>`}</div></div>`;
  const lv=LV.map(l=>`<h4 style="margin:12px 0 0;text-align:center">${l}</h4><div class="org">${S.members.filter(m=>m.level==l).map(m=>`<div class="oc">${av(m)}<b>${esc(m.name)}</b><small>${esc(m.role)}</small><div class="row"><button class="btn g" onclick="mEd('${m.id}')">Edit</button><button class="btn g" onclick="mPh('${m.id}')">Foto</button><button class="btn r" onclick="mDel('${m.id}')">Hapus</button></div></div>`).join('')||'<small style="color:var(--mut)">Belum ada anggota.</small>'}</div>`).join('');
  return`<div class="card"><h3 style="margin-top:0">Struktur Organisasi</h3><p style="margin-top:0;color:var(--mut);font-size:13px">Anggota di sini dipakai untuk login. Hanya Pimpinan &amp; Manajer yang bisa membuka Master Data, Stok, Riwayat &amp; Excel, dan Pengaturan.</p>${f}<hr style="margin:14px 0">${lv}</div>`}
function mAdd(){const n=$('#mn').value.trim(),j=$('#mj').value.trim(),w=$('#mw').value;if(!n||!j||!w)return toast('Nama, jabatan, dan password wajib diisi.','err');if(dupN(n,''))return toast('Nama sudah dipakai anggota lain.','err');
  S.members.push({id:uid(),name:n,role:j,pass:w,level:$('#ml').value,photo:ui.mp||''});ui.mp='';save();rT();toast('Anggota ditambahkan.','ok')}
function mEd(id){ui.ed=id;ui.mp=S.members.find(m=>m.id==id).photo||'';rT();$('#mf').scrollIntoView({block:'center'})}
function mSv(){const m=S.members.find(x=>x.id==ui.ed),n=$('#mn').value.trim(),j=$('#mj').value.trim(),l=$('#ml').value,w=$('#mw').value;if(!m)return;if(!n||!j)return toast('Nama dan jabatan wajib diisi.','err');if(dupN(n,m.id))return toast('Nama sudah dipakai anggota lain.','err');
  if(!ADM.includes(l)&&lastAdm(m.id))return toast('Minimal harus ada satu Pimpinan/Manajer.','err');if(w){if($('#mo').value!==m.pass)return toast('Password lama salah.','err');m.pass=w}
  Object.assign(m,{name:n,role:j,level:l,photo:ui.mp||''});ui.ed=null;ui.mp='';save();R();toast('Perubahan disimpan.','ok')}
function mPh(id){const f=$('#qf');f.onchange=()=>{img(f.files[0],240,.8,d=>{S.members.find(m=>m.id==id).photo=d;save();rT()});f.value=''};f.click()}
function mDel(id){const m=S.members.find(x=>x.id==id);if(!m)return;if(lastAdm(id))return toast('Minimal harus ada satu Pimpinan/Manajer.','err');if(!confirm(`Hapus anggota ${m.name}?`))return;
  S.members=S.members.filter(x=>x.id!=id);if(ui.user==id)ui.user=null;if(ui.ed==id){ui.ed=null;ui.mp=''}save();R()}
/* ===== PEMBAYARAN, BUKTI, RATING POPUP ===== */
const infoBox=(l,j,n,o)=>`<div class="pinfo"><div><span>${l}:</span><b>${esc(j)||'-'}</b></div><div><span>Nomor:</span><b>${esc(n)||'-'}</b></div><div><span>Nama Pemilik:</span><b>${esc(o)||'-'}</b></div></div>`;
function drvUrl(){let u=String(S.settings.driveLink||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u)){if(/^[a-z][a-z0-9+.-]*:/i.test(u))return'';u='https://'+u}return u}
const drvBtn=()=>{const d=drvUrl();return d?`<a class="btn g" href="${esc(d)}" target="_blank" rel="noopener noreferrer">Buka Google Drive</a>`:''};
function proofBox(){return`<div class="pinfo"><div><span>Bukti Pembayaran</span><b>${ui.proof?esc(ui.proof.name):'belum dipilih'}</b></div><div class="row" style="margin-top:6px"><label class="btn g" style="cursor:pointer">📎 ${ui.proof?'Ganti file':'Pilih file'}<input type="file" accept="image/*,application/pdf" hidden onchange="setProof(this)"></label>${ui.proof?'<button class="btn g" onclick="ui.proof=null;rC()">Hapus</button>':''}${drvBtn()}</div><small style="display:block;margin-top:4px;color:var(--mut)">Nama file otomatis diganti sesuai ID_Transaksi.${scUrl()?' Dikirim otomatis ke Google Drive setelah Bayar &amp; Simpan.':''}</small></div>`}
function payBox(){const s=S.settings;return(ui.pm=='Transfer'?infoBox('Jenis Bank',s.bankJenis,s.bankNo,s.bankNama):ui.pm=='E-Wallet'?infoBox('Jenis E-Wallet',s.ewJenis,s.ewNo,s.ewNama):qrBox())+proofBox()}
function setProof(i){ui.proof=i.files[0]||null;rC()}
function askRt(id){ui.rid=id;ui.rt=0;rtModal();if(ui.pq)sendProof()}
function pickRt(n){ui.rt=n;rtModal()}
function rtModal(){const f=ui.pf;modal(`<h3 style="margin:0;text-align:center">✅ Transaksi ${esc(ui.rid)} tersimpan</h3>
  <p style="text-align:center;margin:10px 0 0">Bagaimana pelayanan kami? Beri rating:</p>
  <div class="rt" style="justify-content:center;margin:8px 0 2px">${[1,2,3,4,5].map(i=>`<button type="button" onclick="pickRt(${i})" aria-label="${i} bintang" title="${i} bintang">${STAR(i<=ui.rt?'s1':'s0')}</button>`).join('')}</div>
  <p style="text-align:center;margin:0;color:var(--mut);font-size:13px">${ui.rt?ui.rt+' dari 5 bintang':'Pilih jumlah bintang'}</p>
  ${f?`<div class="pinfo" style="margin-top:12px"><div><span>Bukti pembayaran</span><b>${esc(f)}</b></div><small style="color:var(--mut)">File sudah terunduh dengan nama sesuai ID_Transaksi. Unggah file tersebut ke Google Drive.</small>${drvUrl()?`<div class="row" style="margin-top:6px">${drvBtn()}</div>`:'<small style="display:block;margin-top:4px;color:var(--mut)">Link Google Drive belum diatur di Pengaturan.</small>'}</div>`:''}
  ${pstBox()}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="sendRt()">Berikan Ulasan</button><button class="btn g" onclick="mc()">Nanti Saja</button></div>`)}
function sendRt(){if(!ui.rt)return toast('Pilih jumlah bintang terlebih dahulu.','err');S.sales.forEach(s=>{if(s.id==ui.rid)s.rating=ui.rt});save();mc();toast(`Terima kasih! Rating ${ui.rt} bintang tersimpan.`,'ok')}
function payCard(){const s=S.settings,f=(l,k,ph)=>`<label>${l}<input value="${esc(s[k])}" placeholder="${ph||''}" oninput="sv('${k}',this.value)"></label>`;
  return`<div class="card"><h3 style="margin-top:0">Pembayaran &amp; Bukti Transaksi</h3><h4 style="margin:8px 0 0">Transfer</h4>${f('Jenis Bank','bankJenis')}${f('Nomor','bankNo')}${f('Nama Pemilik','bankNama')}<h4 style="margin:14px 0 0">E-Wallet</h4>${f('Jenis E-Wallet','ewJenis')}${f('Nomor','ewNo')}${f('Nama Pemilik','ewNama')}<h4 style="margin:14px 0 0">Bukti Pembayaran</h4>${f('Link Google Drive penerima bukti','driveLink','https://drive.google.com/drive/folders/...')}${f('URL Web App Google Apps Script (kirim bukti otomatis)','scriptUrl','https://script.google.com/macros/s/.../exec')}<small style="color:var(--mut)">Jika URL Web App diisi, bukti otomatis terkirim ke folder Google Drive setelah Bayar &amp; Simpan (nama file = ID_Transaksi). Jika kosong, file hanya diunduh lalu diunggah manual lewat tombol Drive.</small></div>`}
/* ===== KIRIM BUKTI OTOMATIS KE GOOGLE DRIVE ===== */
function scUrl(){const u=String(S.settings.scriptUrl||'').trim();return /^https:\/\/script\.google\.com\/.+\/exec$/.test(u)?u:''}
function saveProof(id){const f=ui.proof;ui.pst='';ui.pq=null;if(!f)return'';const e=(f.name.match(/\.[A-Za-z0-9]{1,5}$/)||[''])[0].toLowerCase();ui.proof=null;if(!scUrl()){dl(f,id+e);return id+e}ui.pq={id,f,e};return id+(f.type.startsWith('image/')?'.jpg':e)}
const stRt=id=>{if(!$('#modal').hidden&&ui.rid==id)rtModal()};
const b64=f=>new Promise((ok,no)=>{const x=new FileReader();x.onload=()=>ok(x.result.split(',')[1]);x.onerror=no;x.readAsDataURL(f)});
async function sendProof(){const q=ui.pq;if(!q)return;ui.pst='kirim';stRt(q.id);let r='gagal';
  try{const im=q.f.type.startsWith('image/');if(!im&&q.f.size>8e6)throw 0;
    const data=im?(await Promise.race([new Promise(k=>img(q.f,1600,.82,k)),new Promise((_,n)=>setTimeout(n,25000))])).split(',')[1]:await b64(q.f);
    const body=JSON.stringify({name:q.id+(im?'.jpg':q.e),type:im?'image/jpeg':(q.f.type||'application/pdf'),data});let res=null;
    try{res=await fetch(scUrl(),{method:'POST',body})}catch(e){}
    if(res){const j=await res.json().catch(()=>null);r=j?(j.ok?'ok':'gagal'):'tk'}
    else{await fetch(scUrl(),{method:'POST',body,mode:'no-cors'});r='tk'}}
  catch(e){r='gagal'}
  if(ui.pq===q){ui.pst=r;if(r!='gagal')ui.pq=null;stRt(q.id)}
  toast(r=='gagal'?'Bukti gagal terkirim ke Google Drive.':'Bukti terkirim ke Google Drive.',r=='gagal'?'err':'ok')}
function dlProof(){const q=ui.pq;if(q)dl(q.f,q.id+q.e)}
function pstBox(){const s=ui.pst;if(!s)return'';const m={kirim:'⏳ Mengirim bukti ke Google Drive…',ok:'✅ Bukti terkirim ke Google Drive.',tk:'✅ Bukti terkirim ke Google Drive (tanpa konfirmasi, mohon cek folder Drive).',gagal:'⚠️ Bukti belum terkirim. Periksa koneksi dan URL Web App di Pengaturan.'}[s];
  return`<div class="pinfo" style="margin-top:12px"><div><span>Bukti pembayaran</span><b>${esc(ui.pn)}</b></div><div style="display:block">${m}</div>${s=='gagal'?'<div class="row" style="margin-top:6px"><button class="btn g" onclick="sendProof()">Kirim ulang</button><button class="btn g" onclick="dlProof()">Unduh file</button></div>':''}</div>`}
/* ===== HEADER VIA LINK ===== */
const VID_RE=/\.(mp4|webm|ogv|ogg|m4v|mov)(\?[^#]*)?(#.*)?$/i;
function hdrSrc(){const s=S.settings,u=String(s.hdrUrl||'').trim();if(!u)return s.hdrImg||'';const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/i);if(m)return'https://lh3.googleusercontent.com/d/'+m[1];if(!/^https?:\/\//i.test(u))return /^[a-z][a-z0-9+.-]*:/i.test(u)?'':'https://'+u.replace(/^\/+/,'');return u.replace(/["'()\s]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'))}
function hdrLabel(){const u=hdrSrc();return !u?'Belum dipilih':(u.startsWith('data:video/')||VID_RE.test(u))?'Video aktif':/^data:image\/(gif|webp)|\.(gif|webp)(\?[^#]*)?(#.*)?$/i.test(u)?'Animasi aktif':'Foto aktif'}
function shUrl(v){v=String(v||'').trim();sv('hdrUrl',v);if(v)sv('hdrImg','');rT()}
/* ===== INIT ===== */
persist();R();const lw=lows();if(lw.length)toast(`${lw.length} produk menipis/habis: ${lw.map(p=>p.name).join(', ')}. Segera pesan ulang!`,'warn');
</script>
</body></html>
